services:
  postgres:
    image: postgres:18
    container_name: vertical-slice-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: vertical_slice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d vertical_slice"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
