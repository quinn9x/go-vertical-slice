# lefthook.yml
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -s -w {staged_files}
      stage_fixed: true
    vet:
      glob: "*.go"
      run: go vet {all_files}
    lint:
      glob: "*.go"
      run: golangci-lint run {staged_files}

pre-push:
  commands:
    test:
      run: go test -short -timeout=60s ./...

# Build commit messages
prepare-commit-msg:
  commands:
    commitzen:
      interactive: true
      run: pnpm run cz --hook # Or npx cz --hook
      env:
        LEFTHOOK: "0"

# Validate commit messages
commit-msg:
  commands:
    "lint commit message":
      run: pnpm run commitlint --edit {1}